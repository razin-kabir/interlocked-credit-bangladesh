[project]
name = "interlocked-credit-bangladesh"
version = "1.0.0"
description = "Replication code for 'Interlocked Credit in Agricultural Commodity Markets' (Bangladesh rice traders, MATS 2018)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.3",
    "ipykernel>=6.29",
    "linearmodels>=7.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.16",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyogrio>=0.12.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false
